<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CZ Repair Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: counter tool — picker rail on the left, one quote panel on the right; yellow = the price you say out loud */
:root{
  --bg:#eef1f6; --surface:#ffffff; --sunk:#f5f7fa; --ink:#121a2c; --muted:#5a6479; --line:#d5dbe5;
  --accent:#1e3f8f; --accent-soft:#e3eafa; --quote:#ffd43b; --quote-ink:#1a1400; --quote-soft:#fff6cc;
  --warn:#9a4a00; --warn-soft:#fff1e0; --ok:#16733a; --ok-soft:#e2f5e8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1220; --surface:#141c2d; --sunk:#10172566; --ink:#e9edf4; --muted:#98a3b8; --line:#26324a;
  --accent:#86a8ff; --accent-soft:#1c2a4a; --quote:#ffd43b; --quote-ink:#1a1400; --quote-soft:#3a3212;
  --warn:#ffb562; --warn-soft:#3a2810; --ok:#5fd98a; --ok-soft:#123222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1220; --surface:#141c2d; --sunk:#10172566; --ink:#e9edf4; --muted:#98a3b8; --line:#26324a;
  --accent:#86a8ff; --accent-soft:#1c2a4a; --quote:#ffd43b; --quote-ink:#1a1400; --quote-soft:#3a3212;
  --warn:#ffb562; --warn-soft:#3a2810; --ok:#5fd98a; --ok-soft:#123222; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:820px){.rail{position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font:600 13px/1 var(--body);padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
input[type=search]{width:100%;font:500 16px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.list{max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
@media (max-width:820px){.list{max-height:38vh}}
.grp{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.mdl{text-align:left;font:500 15px var(--body);padding:8px 10px;border-radius:6px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.mdl:hover{background:var(--sunk)} .mdl[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.model{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0}
.lbl{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.quote{background:var(--quote);color:var(--quote-ink);border-radius:10px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center}
.quote .q-l{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase}
.quote .q-p{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums;grid-row:span 2;text-align:right}
.quote .q-d{font-weight:600;font-size:16px}
.quote.none{background:var(--sunk);color:var(--ink);border:1px dashed var(--line)}
.quote.two .q-p{font-size:40px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.tiers{grid-template-columns:minmax(0,1fr)}}
.tier{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--sunk);min-width:0}
.tier .t-n{font-weight:700;font-size:14px}
.tier .t-p{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.tier .t-x{font-size:13px;color:var(--muted)}
.tier.q{background:var(--quote-soft);border:2px solid var(--quote)}
.tier.na{opacity:.45}
.tag{align-self:flex-start;font:700 11px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:4px}
.tag.say{background:var(--quote);color:var(--quote-ink)}
.tag.up{background:var(--warn-soft);color:var(--warn)}
.tag.off{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.rowhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.chk .box{width:22px;height:22px;border-radius:5px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--surface)}
.chk[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok)}
.chk[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.chk b{display:block;font-size:15px}
.chk span.s{font-size:14px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.seg button{font:600 13px var(--body);padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.warnbar{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:6px 10px;font-weight:600;font-size:13px;margin-top:6px}
.script{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:17px;line-height:1.5}
.btn{align-self:flex-start;font:700 14px var(--body);padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--surface);cursor:pointer}
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.oth{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:6px;background:var(--sunk);font-size:13px;color:var(--muted);min-width:0}
.oth b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
@media (prefers-reduced-motion:no-preference){.tier,.chip,.chk{transition:background .12s,border-color .12s}}

.sayline{font-size:19px;line-height:1.45;font-weight:700;color:var(--ink)}
.sayrow{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font:700 12px var(--body);letter-spacing:.03em;padding:4px 8px;border-radius:5px;border:1px solid var(--line);background:var(--surface)}
.fact.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.fact.wn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.loading{padding:40px;text-align:center;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Cellular Zone <span>Repair Quote</span></h1>
    <div class="meta" id="meta">Loading prices…</div>
  </header>
  <div class="grid">
    <aside class="rail">
      <div class="tabs" id="tabs" role="group" aria-label="Device type"></div>
      <input type="search" id="q" placeholder="Search model (e.g. 15 pro max)" autocomplete="off" aria-label="Search model">
      <div class="list" id="list"></div>
    </aside>
    <main class="panel" id="panel"><div class="card loading">Loading prices…</div></main>
  </div>
</div>
<script src="live.js"></script>
<script src="app.js"></script>

</body>
</html>
